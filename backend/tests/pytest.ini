; Cấu hình PYTEST. Đặt cạnh bộ test chứ không ở gốc `backend/`, và vì thế chỉ được
; tìm thấy khi chạy `python -m pytest tests` (pytest dò file cấu hình từ thư mục của
; ĐỐI SỐ trở lên). `npm run test` đã truyền `tests` — gõ `pytest` trần thì cấu hình
; này KHÔNG được nạp và cache lại rơi ra ngoài.
;
; `cache_dir` tính theo rootdir = chính thư mục này, nên `../.cache/pytest` trỏ về
; `backend/.cache/pytest` — chung một chỗ với cache của ruff.
[pytest]
cache_dir = ../.cache/pytest
testpaths = .
addopts = -q
