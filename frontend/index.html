<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Phông chữ (Manrope + JetBrains Mono) NHÚNG SẴN trong bản build — xem
         src/assets/fonts/fonts.css. Không tải từ Google Fonts: bản ứng dụng phải chạy
         được trên máy không có mạng. -->
    <meta
      name="description"
      content="Trích xuất thông tin từ hồ sơ và kiểm tra theo bộ quy định do người dùng cung cấp."
    />
    <!-- Đặt class 'dark' + ngôn ngữ TRƯỚC khi React dựng cây: tránh nháy nền trắng
         khi người dùng đang ở chế độ tối (lần vẽ đầu tiên đã đúng màu). -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem("datn6:theme");
          // Chưa chọn lần nào -> TỐI (khớp src/theme.ts).
          var dark = s !== "light";
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          // Nền đúng màu ngay lần vẽ đầu (trước khi CSS nạp xong) — không nháy trắng.
          document.documentElement.style.backgroundColor = dark ? "#08111f" : "#eef2f8";
          if (localStorage.getItem("datn6:lang") === "en") document.documentElement.lang = "en";
          document.documentElement.dataset.sidebar =
            localStorage.getItem("datn6:sidebar") === "collapsed" ? "collapsed" : "pinned";
        } catch (e) {
          /* localStorage bị chặn -> mặc định tối + tiếng Việt */
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <title>IERCV</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
